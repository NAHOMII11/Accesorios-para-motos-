
server.port=8083


spring.application.name=orders-service


spring.datasource.url=jdbc:postgresql://localhost:5432/ordersdb
spring.datasource.username=reto
spring.datasource.password=reto123
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=reto
spring.rabbitmq.password=reto

# Actuator (reto: /actuator/health)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized